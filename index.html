}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --earth:#d3a273; --earth-soft:#35281b; --river:#79b6d4; --river-soft:#17303c;
  --mahua:#c99ad3; --mahua-soft:#33243a; --danger:#f08a76; --danger-soft:#3c1d17; color-scheme:dark}}
:root[data-theme="dark"]{

  --leaf:#ffffff; --leaf-soft:#2a2a2a; --green:#7cc28a; --green-soft:#1f3524; --turmeric:#e8b445; --turmeric-soft:#3a2f14;
  --earth:#d3a273; --earth-soft:#35281b; --river:#79b6d4; --river-soft:#17303c;
  --mahua:#c99ad3; --mahua-soft:#33243a; --danger:#f08a76; --danger-soft:#3c1d17; color-scheme:dark}
*{box-sizing:border-box}

:focus-visible{outline:2px solid var(--turmeric);outline-offset:2px}

header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--surface);border-bottom:1px solid var(--line)}

#state{max-width:170px} #month{width:72px}

@media (max-width:820px){

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}

const mAt=k=>((state.m-1+k)%12)+1;
const untilMonths=p=>{for(let k=0;k<12;k++)if(p.months.includes(mAt(k)))return k;return 99};
const leftMonths=p=>{if(p.months.length===12)return 12;let k=0;while(k<12&&p.months.includes(mAt(k)))k++;return k};
const availLabel=p=>{if(p.months.length===12)return "Available all year";const u=untilMonths(p);if(u===0){const l=leftMonths(p);return l===1?`Now · last month`:`Now · ${l} more months`}return `Back in ${MONTHS[mAt(u)-1]}`+(u===1?" (next month)":"")};

function sortList(list){const s=state.sort;return [...list].sort((a,b)=>{
  if(s==="az")return a.name.localeCompare(b.name);
  const ua=untilMonths(a),ub=untilMonths(b);
  if(s==="ending"){if((ua===0)!==(ub===0))return ua===0?-1:1;if(ua===0)return leftMonths(a)-leftMonths(b)||a.name.localeCompare(b.name);return ua-ub||a.name.localeCompare(b.name)}
  return ua-ub||leftMonths(b)-leftMonths(a)||b.months.length-a.months.length||a.name.localeCompare(b.name)})}

function nearList(){
  const L=local();
  let list=state.mode==="now"?L.filter(p=>inSeason(p)):L;
  if(state.type!=="all")list=list.filter(p=>p.type===state.type);
  if(state.q){const q=state.q.toLowerCase();list=list.filter(p=>(p.name+p.local+p.sci+p.note).toLowerCase().includes(q))}
  return sortList(list);
}
function renderNearList(){
  const list=nearList();

}

   <li><span><b>100% sure or don't eat it.</b> Check the leaf, stem, flower, smell and sap. If one feature is off, leave it.</span></li>
   <li><span><b>Learn from locals.</b> Village elders, vegetable sellers and tribal foragers know the lookalikes.</span></li>

function renderAll(){renderTip();renderNear();renderNutrition();renderMenu();renderSafety();route()}

const ss=$("#state");Object.keys(STATES).forEach(s=>ss.add(new Option(s,s,false,s===state.st)));
const ms=$("#month");MONTHS.forEach((m,i)=>ms.add(new Option(m,i+1,false,i+1===state.m)));
ss.onchange=e=>{state.st=e.target.value;store.set("fi-state",state.st);renderAll()};
ms.onchange=e=>{state.m=+e.target.value;renderAll()};
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-gsrc]");if(g){const h=document.getElementById("heroimg");if(h){h.src=g.dataset.gsrc;document.getElementById("herocap").innerHTML=g.dataset.gcap;document.querySelectorAll(".tb").forEach(t=>t.classList.toggle("on",t===g))}return}
  if(e.target.id==="copyupi"){const t=TIP.upiId;const done=()=>{e.target.textContent="Copied"};navigator.clipboard?.writeText(t).then(done,()=>{const r=document.createRange();r.selectNodeContents($("#upi"));const sel=getSelection();sel.removeAllRanges();sel.addRange(r)});return}
  const o=e.target.closest("[data-open]");if(o){openSheet(o.dataset.open);return}
  const t=e.target.closest("[data-type]");if(t){state.type=t.dataset.type;renderNearList();return}
  const m=e.target.closest("[data-mode]");if(m){state.mode=m.dataset.mode;renderNearList();return}
  const mm=e.target.closest("[data-menu]");if(mm){state.menu=mm.dataset.menu;renderMenu();return}
  const jp=e.target.closest("[data-jump]");if(jp){e.preventDefault();document.getElementById("course-"+jp.dataset.jump)?.scrollIntoView({behavior:"smooth",block:"start"});return}
  const n=e.target.closest("[data-nutr]");if(n){state.nutr=n.dataset.nutr;renderNutrition()}
});
addEventListener("hashchange",route);
renderAll();
</script>

<script>
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
</body>
</html>
